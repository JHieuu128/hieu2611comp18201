<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hồ cá vui nhộn</title>
  <link rel="stylesheet" href="mystyle.css">
</head>
<body>
  <div id="content">
    <div id="shark" class="creature">
      <img src="images/shark.png" alt="Cá mập">
    </div>

    <div id="goldFishSchool" class="creature">
      <img src="images/goldFishSchool.png" alt="Đàn cá vàng">
    </div>

    <div id="faintSchool" class="creature">
      <img src="images/faintSchool.png" alt="Đàn cá mờ">
    </div>

    <div id="diver1" class="creature">
      <img src="images/diver1.png" alt="Thợ lặn 1">
    </div>

    <div id="diver2" class="creature">
      <img src="images/diver2.png" alt="Thợ lặn 2">
    </div>

    <div id="diver3" class="creature">
      <img src="images/diver3.png" alt="Thợ lặn 3">
    </div>

    <div id="turtle" class="creature">
      <img src="images/turtle.png" alt="Con rùa">
    </div>

    <span class="bubble b1"></span>
    <span class="bubble b2"></span>
    <span class="bubble b3"></span>
    <span class="bubble b4"></span>
    <span class="bubble b5"></span>

    <div class="seabed"></div>
  </div>
</body>
</html>
