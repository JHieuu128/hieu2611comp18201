<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liên hệ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a href="index.html" class="site-title">Website Cá Nhân</a>
      <nav class="nav" aria-label="Điều hướng chính">
        <a href="index.html">Trang chủ</a>
        <a href="ke-hoach.html">Kế hoạch học tập</a>
        <a href="so-thich.html">Sở thích</a>
        <a href="lien-he.html" class="active">Liên hệ</a>
      </nav>
      <div class="bg-switcher" aria-label="Chọn màu nền">
        <button type="button" class="bg-btn active" data-bg="white">Trắng</button>
        <button type="button" class="bg-btn" data-bg="gray">Xám</button>
        <button type="button" class="bg-btn" data-bg="dark">Tối</button>
      </div>
    </div>
  </header>

  <main class="container main">
    <section class="page-section">
      <h1>Liên hệ</h1>

      <div class="contact-layout">
        <form id="contact-form" class="contact-form" novalidate>
          <div class="form-group">
            <label for="contact-name">Họ tên</label>
            <input type="text" id="contact-name" name="name" placeholder="Nhập họ tên...">
          </div>
          <div class="form-group">
            <label for="contact-email">Email</label>
            <input type="email" id="contact-email" name="email" placeholder="Nhập email...">
          </div>
          <div class="form-group">
            <label for="contact-message">Nội dung</label>
            <textarea id="contact-message" name="message" placeholder="Nhập nội dung liên hệ..."></textarea>
          </div>
          <button type="submit" class="btn">Gửi liên hệ</button>
          <p id="form-status" class="form-status" role="status" aria-live="polite"></p>
        </form>

        <div class="map-box">
          <iframe
            title="Bản đồ vị trí"
            loading="lazy"
            referrerpolicy="no-referrer-when-downgrade"
            src="https://www.google.com/maps?q=Ho+Chi+Minh+City&output=embed">
          </iframe>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <p>&copy; 2026 Website Cá Nhân</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
